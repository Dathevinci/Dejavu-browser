name: Build & Release dejavu

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build dejavu.exe
        shell: pwsh
        run: .\build.ps1

      - name: Detect Windows Authenticode signing configuration
        id: sign-config
        shell: pwsh
        env:
          HAS_AZURE_TENANT: ${{ secrets.AZURE_TENANT_ID != '' }}
          HAS_AZURE_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT != '' }}
          HAS_WINDOWS_PFX: ${{ secrets.WINDOWS_CERT_PFX_B64 != '' }}
        run: |
          if ($env:HAS_AZURE_TENANT -eq 'true' -and $env:HAS_AZURE_ENDPOINT -eq 'true') {
            "mode=trusted" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Windows Authenticode signing: Microsoft Trusted Signing is enabled."
          } elseif ($env:HAS_AZURE_TENANT -ne 'true' -and $env:HAS_WINDOWS_PFX -eq 'true') {
            "mode=pfx" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Windows Authenticode signing: PFX certificate fallback (SHA-256 + DigiCert RFC 3161) is enabled."
          } else {
            "mode=unsigned" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Windows Authenticode signing: No signing secrets configured yet. Continuing cleanly; configure AZURE_TENANT_ID + AZURE_TRUSTED_SIGNING_ENDPOINT (Microsoft Trusted Signing) or WINDOWS_CERT_PFX_B64 (PFX) in Repository Secrets to enable automatic Windows SmartScreen trust."
          }

      - name: Sign dejavu.exe with Microsoft Trusted Signing
        if: steps.sign-config.outputs.mode == 'trusted'
        uses: azure/trusted-signing-action@v0.5.11
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT || secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE || secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files: ${{ github.workspace }}\dist\dejavu.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Sign dejavu.exe with PFX Authenticode (Fallback)
        if: steps.sign-config.outputs.mode == 'pfx'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_B64: ${{ secrets.WINDOWS_CERT_PFX_B64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) {
            throw "signtool.exe not found under Windows Kits."
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "dejavu-codesign.pfx"
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_B64))
            $signArgs = @("sign", "/f", $pfxPath, "/fd", "SHA256", "/tr", "http://timestamp.digicert.com", "/td", "SHA256")
            if ($env:WINDOWS_CERT_PASSWORD) {
              $signArgs += @("/p", $env:WINDOWS_CERT_PASSWORD)
            }
            $signArgs += "dist\dejavu.exe"
            & $signtool.FullName @signArgs
            if ($LASTEXITCODE -ne 0) {
              throw "signtool.exe failed while signing dist\dejavu.exe (exit $LASTEXITCODE)."
            }
          } finally {
            if (Test-Path $pfxPath) {
              Remove-Item $pfxPath -Force
            }
          }

      - name: Build dejavu-Setup.exe
        shell: pwsh
        run: .\build-setup.ps1

      - name: Sign dejavu-Setup.exe with Microsoft Trusted Signing
        if: steps.sign-config.outputs.mode == 'trusted'
        uses: azure/trusted-signing-action@v0.5.11
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT || secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE || secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files: ${{ github.workspace }}\dist\dejavu-Setup.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Sign dejavu-Setup.exe with PFX Authenticode (Fallback)
        if: steps.sign-config.outputs.mode == 'pfx'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_B64: ${{ secrets.WINDOWS_CERT_PFX_B64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) {
            throw "signtool.exe not found under Windows Kits."
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "dejavu-codesign.pfx"
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_B64))
            $signArgs = @("sign", "/f", $pfxPath, "/fd", "SHA256", "/tr", "http://timestamp.digicert.com", "/td", "SHA256")
            if ($env:WINDOWS_CERT_PASSWORD) {
              $signArgs += @("/p", $env:WINDOWS_CERT_PASSWORD)
            }
            $signArgs += "dist\dejavu-Setup.exe"
            & $signtool.FullName @signArgs
            if ($LASTEXITCODE -ne 0) {
              throw "signtool.exe failed while signing dist\dejavu-Setup.exe (exit $LASTEXITCODE)."
            }
          } finally {
            if (Test-Path $pfxPath) {
              Remove-Item $pfxPath -Force
            }
          }

      - name: Verify Windows Authenticode signatures
        if: steps.sign-config.outputs.mode != 'unsigned'
        shell: pwsh
        run: |
          foreach ($bin in @("dist\dejavu.exe", "dist\dejavu-Setup.exe")) {
            $sig = Get-AuthenticodeSignature -FilePath $bin
            Write-Host ("{0}: Status={1} Subject={2}" -f $bin, $sig.Status, $sig.SignerCertificate.Subject)
            if ($sig.Status -ne "Valid") {
              throw "Authenticode signature verification failed for $bin (Status=$($sig.Status))."
            }
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dejavu-windows-x64
          path: |
            dist/dejavu.exe
            dist/dejavu-Setup.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Android release signing keystore
        run: |
          if [ -n "${{ secrets.DEJAVU_ANDROID_KEYSTORE_B64 }}" ]; then
            mkdir -p /tmp/dejavu-sign
            echo "${{ secrets.DEJAVU_ANDROID_KEYSTORE_B64 }}" | base64 -d > /tmp/dejavu-sign/dejavu-release.jks
            KS_PATH="/tmp/dejavu-sign/dejavu-release.jks"
            echo "Using repository secret signing keystore."
          else
            KS_PATH="$GITHUB_WORKSPACE/android/keystore/dejavu-release.jks"
            if [ ! -f "$KS_PATH" ]; then
              echo "ERROR: Persistent Android signing keystore missing at $KS_PATH" >&2
              exit 1
            fi
            echo "Using persistent repository signing keystore: $KS_PATH"
          fi
          echo "DEJAVU_KEYSTORE_PATH=$KS_PATH" >> "$GITHUB_ENV"
          LC_ALL=C keytool -list -v \
            -keystore "$KS_PATH" \
            -storepass "${{ secrets.DEJAVU_ANDROID_KEYSTORE_PASS || 'dejavu2026' }}" \
            -alias "${{ secrets.DEJAVU_ANDROID_KEY_ALIAS || 'dejavu' }}" | grep -E "Alias name:|Owner:|Valid from:|SHA256:"

      - name: Build signed dejavu-mobile.apk
        working-directory: android
        env:
          DEJAVU_KEYSTORE_PASS: ${{ secrets.DEJAVU_ANDROID_KEYSTORE_PASS || 'dejavu2026' }}
          DEJAVU_KEY_ALIAS: ${{ secrets.DEJAVU_ANDROID_KEY_ALIAS || 'dejavu' }}
          DEJAVU_KEY_PASS: ${{ secrets.DEJAVU_ANDROID_KEY_PASS || 'dejavu2026' }}
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/dejavu-mobile.apk
          ls -lh ../dist/dejavu-mobile.apk

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          echo "Using $APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs dist/dejavu-mobile.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dejavu-android-apk
          path: dist/dejavu-mobile.apk

  publish-release:
    needs: [build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: dejavu-windows-x64
          path: release-files

      - name: Download Android APK artifact
        uses: actions/download-artifact@v4
        with:
          name: dejavu-android-apk
          path: release-files

      - name: Generate SHA-256 Checksums
        run: |
          cd release-files
          sha256sum dejavu-Setup.exe dejavu.exe dejavu-mobile.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest Build Provenance (SLSA)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release-files/dejavu-Setup.exe
            release-files/dejavu.exe
            release-files/dejavu-mobile.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          cat > /tmp/release_notes.md <<'EOF'
          ### dejavu __TAG__ — Reliable Self-Healing VPN, Theme-Adaptive Butterfly Video Downloader & Fluid 120Hz Polish

          - **Re-Engineered Reliable Self-Healing VPN (Zero Broken Sites)**:
            - **Strict Multi-Site HTTPS/TLS Browsing Verification** — Every Smart relay must pass concurrent real HTTPS/TLS checks (`cloudflare.com/cdn-cgi/trace`, `google.com/generate_204`, and GeoIP) before reporting Connected — never accepting half-dead or port-443-blocked proxies.
            - **3-Strike Circuit Breaker, Hedged Failover & Background Auto-Heal** — Unhealthy relays trip a 45s circuit breaker (`<1ms` skip), hedged parallel failover eliminates stalled sockets and `502 Bad Gateway` errors, background auto-heal refreshes degraded pools automatically, and **seamless 3-Hop Encrypted Tor fallback** engages transparently whenever clean Smart relays are unavailable.
            - **1-Click Live Tunnel Verifier & Upgraded M3 VPN Popover** — Test live HTTPS connectivity directly through the active tunnel and view verified status, active engine (`Smart Clean-IP` vs `3-Hop Encrypted Tor`), exit IP, and latency inline.
          - **Theme-Adaptive Material Design 3 Butterfly Video Downloader (Windows & Android)**:
            - **Full 24-Palette Dynamic Material You Sync** — Live-syncs across all **12 Material You HCT color themes × Dark & Light polarity** across every open tab whenever you switch themes or auto-matching wallpapers (zero hardcoded dark amethyst).
            - **Expressive M3 Card, `Video | Audio` Switcher & Sleek Scrollbars** — Compact **`36×36px`** circular Butterfly FAB expands into a `24px`-radius M3 card with a **`Video | Audio` segmented switcher**, **`30×30px` circular M3 download arrow buttons**, `Send to Phone / PC` timestamp handoff, and sleek themed thin scrollbars (zero classic white scrollbars!).
          - **Whole-Browser Fluid 120Hz Polish (Windows & Android)**:
            - **Windows Fluid Material Design 3 Polish** — Unified M3 Expressive motion curves, tactile micro-interactions, smooth Start Page wallpaper & theme crossfades, and whisper-sleek theme-tinted scrollbars across every surface.
            - **Android Fluid 120Hz Polish (`__TAG__` · `versionCode 570`)** — Interactive **finger-tracking swipe-to-dismiss bottom sheets** (`translate3d` drag + velocity flick-to-close + spring snap-back), `overscroll-behavior-y: contain` scroll containment, and buttery tab-switch transitions.
          - **Preserved Open-Source Security Hardening, 32 HD Wallpapers & Core Ecosystem**:
            - **Security & Anti-False-Positive Hardening** — Full Win32 PE VersionInfo (`FileVersion 5.7.0.0`, `dejavu Browser`), explicit `asInvoker` UAC manifest, `/highentropyva+` & `/deterministic`, zero `WScript.Shell`/batch scripts, ready-to-activate **Microsoft Trusted Signing** (`azure/trusted-signing-action`) + PFX Authenticode fallback hooks; Play-Protect-clean Android (`allowBackup="false"`, system-CA `networkSecurityConfig`, zero `REQUEST_INSTALL_PACKAGES`/`PackageInstaller` dropper permissions, permanent V1+V2+V3 signing); published **`SHA256SUMS.txt`** & GitHub **SLSA Build Provenance Attestations**.
            - **32 Curated M3 HD Wallpapers (`10` Butterflies + `4` Cute Froggies)**, **12 Material You HCT Themes**, **`dejavu Link v2.3` Continuity Hub**, **100%-Verified Brave-Exact Shields** (`279K+` Windows / `108K+` Android rules), Windows Hello & Android Passkeys, Real Chrome MV3 Extensions, and `<1%` idle CPU.
            > **Android Upgrade Note (`__TAG__`, `versionCode 570`):** Upgrading from `v4.2.0` or earlier? Uninstall dejavu once, then install `__TAG__` — future releases keep the same permanent V1+V2+V3 signing key for smooth upgrades from GitHub Releases.

          #### Downloads & Verification
          - **dejavu-Setup.exe** — Windows 10/11 Guided Installer (`FileVersion 5.7.0.0`, security-hardened `asInvoker` + zero `WScript.Shell`/batch scripts, Re-Engineered Self-Healing VPN + 3-Hop Tor, Theme-Adaptive 24-Palette Butterfly Video Downloader, Fluid 120Hz M3 Polish & sleek themed scrollbars, 32 Curated M3 Wallpapers, `dejavu Link v2.3`, Brave-Exact Shields `279K+` rules & Chrome MV3 Extensions)
          - **dejavu.exe** — Windows 10/11 Portable Single-File (`FileVersion 5.7.0.0`, `/highentropyva+`, deterministic build, full Win32 PE VersionInfo)
          - **dejavu-mobile.apk** — Android Mobile Browser App (`__TAG__` · `versionCode 570` — Play-Protect-clean zero dropper permissions, `allowBackup="false"`, system-CA `networkSecurityConfig`, Theme-Adaptive 24-Palette Butterfly Video FAB, interactive finger-tracking swipe-to-dismiss sheets & 120Hz polish, 32 M3 Wallpapers with 10 Butterflies & 4 Cute Froggies, `dejavu Link v2.3`, `108K+` Brave-Exact Shields, V1+V2+V3 permanently signed, Android 8.0+)
          - **SHA256SUMS.txt** — Official SHA-256 verification checksums for all release binaries (paired with GitHub SLSA Build Provenance Attestations)
          EOF
          sed -i 's/^          //' /tmp/release_notes.md
          sed -i "s/__TAG__/$TAG/g" /tmp/release_notes.md
          {
            echo ""
            echo '#### SHA-256 Checksums (`SHA256SUMS.txt`)'
            echo '```text'
            cat release-files/SHA256SUMS.txt
            echo '```'
          } >> /tmp/release_notes.md
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            release-files/dejavu-Setup.exe \
            release-files/dejavu.exe \
            release-files/dejavu-mobile.apk \
            release-files/SHA256SUMS.txt \
            --title "dejavu $TAG — Self-Healing VPN, Theme-Adaptive Butterfly Video FAB & Fluid 120Hz Polish" \
            --notes-file /tmp/release_notes.md
