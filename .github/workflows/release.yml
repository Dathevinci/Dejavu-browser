name: Build & Release dejavu

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build dejavu.exe
        shell: pwsh
        run: .\build.ps1

      - name: Build dejavu-Setup.exe
        shell: pwsh
        run: .\build-setup.ps1

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dejavu-windows-x64
          path: |
            dist/dejavu.exe
            dist/dejavu-Setup.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Android release signing keystore
        run: |
          if [ -n "${{ secrets.DEJAVU_ANDROID_KEYSTORE_B64 }}" ]; then
            mkdir -p /tmp/dejavu-sign
            echo "${{ secrets.DEJAVU_ANDROID_KEYSTORE_B64 }}" | base64 -d > /tmp/dejavu-sign/dejavu-release.jks
            KS_PATH="/tmp/dejavu-sign/dejavu-release.jks"
            echo "Using repository secret signing keystore."
          else
            KS_PATH="$GITHUB_WORKSPACE/android/keystore/dejavu-release.jks"
            if [ ! -f "$KS_PATH" ]; then
              echo "ERROR: Persistent Android signing keystore missing at $KS_PATH" >&2
              exit 1
            fi
            echo "Using persistent repository signing keystore: $KS_PATH"
          fi
          echo "DEJAVU_KEYSTORE_PATH=$KS_PATH" >> "$GITHUB_ENV"
          LC_ALL=C keytool -list -v \
            -keystore "$KS_PATH" \
            -storepass "${{ secrets.DEJAVU_ANDROID_KEYSTORE_PASS || 'dejavu2026' }}" \
            -alias "${{ secrets.DEJAVU_ANDROID_KEY_ALIAS || 'dejavu' }}" | grep -E "Alias name:|Owner:|Valid from:|SHA256:"

      - name: Build signed dejavu-mobile.apk
        working-directory: android
        env:
          DEJAVU_KEYSTORE_PASS: ${{ secrets.DEJAVU_ANDROID_KEYSTORE_PASS || 'dejavu2026' }}
          DEJAVU_KEY_ALIAS: ${{ secrets.DEJAVU_ANDROID_KEY_ALIAS || 'dejavu' }}
          DEJAVU_KEY_PASS: ${{ secrets.DEJAVU_ANDROID_KEY_PASS || 'dejavu2026' }}
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/dejavu-mobile.apk
          ls -lh ../dist/dejavu-mobile.apk

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          echo "Using $APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs dist/dejavu-mobile.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dejavu-android-apk
          path: dist/dejavu-mobile.apk

  publish-release:
    needs: [build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: dejavu-windows-x64
          path: release-files

      - name: Download Android APK artifact
        uses: actions/download-artifact@v4
        with:
          name: dejavu-android-apk
          path: release-files

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          cat > /tmp/release_notes.md <<'EOF'
          ### dejavu __TAG__ — Clean Android Material Design 3 Overhaul, 120Hz Zero-Lag Engine & Google Auto-Sync

          - **Clean Android A-to-Z Material Design 3 Overhaul** — Completely refined for Google Pixel calm: minimal 2-item Start Page top bar (`Linked` chip + profile avatar), centered M3 Origami Butterfly, pure `56px` Pixel search pill with zero cramped chips, airy borderless Quick Access tiles, slim bottom navigation bar ONLY on Start Page (zero duplicate bottom URL bar), crisp monochrome M3 bottom sheets & menus, 6-category Pixel drill-in Settings with live cross-category search, collapsed-by-default advanced disclosures in `dejavu Link`, and dynamic 6-seed Material You tinting across Android's native chrome.
          - **Zero-Lag 120Hz Tab Engine & Anti-Glitch Architecture (Windows & Android)** — Keyed incremental tab reconciliation keeps existing tabs untouched during multi-tab website loads (zero DOM flicker, zero animation replays), lightweight `<6 KB` `tabDelta` IPC replaces full-state storms, dark-surface WebView initialization (`#131116` Dark / `#FBF8FD` Light) eliminates bright white flashes on Windows & Android, crisp M3 Linear Loading Bar tracks page loads smoothly, and zero-reflow auto-hide rail + diff-guarded Android UI keep idle CPU strictly `<1%`.
          - **Zero-QR Google Account Auto-Sync (`dejavu Link`) & Shared Clipboard** — Sign into Google on Windows and Android and **`dejavu Link`** pairs automatically with zero QR scanning required! End-to-end encrypted (`AES-256-CBC + HMAC-SHA256`) with optional extra Sync Passphrase, **Shared Clipboard** (1-tap copy & beam text between PC & phone), **Live Open Tabs ("Continue on Phone / PC")**, **Bookmarks, Reading List & History Sync**, **Connected Device Presence**, granular `52×32` Material 3 Sync toggles, and a discreet collapsible `"Manual pairing & passphrase"` fallback.
          - **Windows Hello & Android Passkeys (WebAuthn) + Universal OAuth Popups** — Full **Windows Hello Passkeys (WebAuthn)** & OS Primary Account SSO on Windows plus **Android WebView WebAuthn (`WEB_AUTHENTICATION_SUPPORT_FOR_APP`)** & 1-tap **"Open in System Tab" (`CustomTabsIntent`)** hardware passkey helper on Android, paired with genuine **Material Design 3 OAuth/SSO Sign-In Popup Windows** preserving `window.opener` and `window.close()` so **"Sign in with Google / GitHub / Apple / Microsoft / Discord"** works everywhere out of the box!
          - **Flagship Material Design 3 Everywhere** — Real Chrome MV3 Extensions Manager (Windows) & Android Web Add-ons + Custom Userscripts (`.user.js`), Dynamic-Color M3 Geometric Butterfly Logo + Android 13+ Themed App Icon, Chrome-grade Tab Drag-to-Reorder, Native M3 Right-Click & Long-Press Context Menus, Native Windows 10/11 & Android (`ROLE_BROWSER`) Default Browser registration, Live-Synced Multi-Profile Google Windows, built-in YouTube & 1,000+ site `4K / 1080p / 720p / MP3 320k` 8× Turbo Downloader, 16 Pure M3 & 4 Butterfly M3 wallpapers, 86-country AI-ready Smart VPN + 3-Hop Tor, 100/100 Ad Shield, and permanent V1+V2+V3 Android signing with `PackageInstaller.Session` in-place auto-updates.
            > **Android Upgrade Note:** Upgrading from `v4.2.0` or earlier? Uninstall dejavu once, then install `__TAG__` — **all future updates will install automatically in-place!**

          #### Downloads
          - **dejavu-Setup.exe** — Windows 10/11 Guided Installer (Zero-Lag 120Hz Engine, Default Browser registration & M3 Butterfly Icon)
          - **dejavu.exe** — Windows 10/11 Portable Single-File
          - **dejavu-mobile.apk** — Android Mobile Browser App (Clean Pixel Material Design 3 Overhaul, Zero-Flash Dark WebView, V1+V2+V3 permanently signed, Material You Themed Icon, Passkeys & Google Auto-Sync, Android 8.0+)
          EOF
          sed -i 's/^          //' /tmp/release_notes.md
          sed -i "s/__TAG__/$TAG/g" /tmp/release_notes.md
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            release-files/dejavu-Setup.exe \
            release-files/dejavu.exe \
            release-files/dejavu-mobile.apk \
            --title "dejavu $TAG — Clean Android Material Design 3 Overhaul, 120Hz Engine & Google Auto-Sync" \
            --notes-file /tmp/release_notes.md
