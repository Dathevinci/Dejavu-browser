name: Build & Release dejavu

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build dejavu.exe
        shell: pwsh
        run: .\build.ps1

      - name: Build dejavu-Setup.exe
        shell: pwsh
        run: .\build-setup.ps1

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dejavu-windows-x64
          path: |
            dist/dejavu.exe
            dist/dejavu-Setup.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Android release signing keystore
        run: |
          mkdir -p /tmp/dejavu-sign
          if [ -n "${{ secrets.DEJAVU_ANDROID_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.DEJAVU_ANDROID_KEYSTORE_B64 }}" | base64 -d > /tmp/dejavu-sign/dejavu-release.jks
          else
            keytool -genkeypair -v \
              -keystore /tmp/dejavu-sign/dejavu-release.jks \
              -storepass dejavu2026 \
              -keypass dejavu2026 \
              -alias dejavu \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=dejavu Browser, OU=Mobile, O=Dathevinci, L=Web, S=Web, C=US"
          fi

      - name: Build signed dejavu-mobile.apk
        working-directory: android
        env:
          DEJAVU_KEYSTORE_PATH: /tmp/dejavu-sign/dejavu-release.jks
          DEJAVU_KEYSTORE_PASS: dejavu2026
          DEJAVU_KEY_ALIAS: dejavu
          DEJAVU_KEY_PASS: dejavu2026
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/dejavu-mobile.apk
          ls -lh ../dist/dejavu-mobile.apk

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          echo "Using $APKSIGNER"
          "$APKSIGNER" verify --verbose dist/dejavu-mobile.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dejavu-android-apk
          path: dist/dejavu-mobile.apk

  publish-release:
    needs: [build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: dejavu-windows-x64
          path: release-files

      - name: Download Android APK artifact
        uses: actions/download-artifact@v4
        with:
          name: dejavu-android-apk
          path: release-files

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          gh release create "$TAG" \
            release-files/dejavu-Setup.exe \
            release-files/dejavu.exe \
            release-files/dejavu-mobile.apk \
            --title "dejavu $TAG — Desktop + Android Mobile (.apk) & Cross-Device Sync" \
            --notes "### dejavu $TAG — macOS Safari Liquid Glass Browser + Android Mobile & PC Sync

- **NEW: dejavu Mobile (\`dejavu-mobile.apk\`)** — Thumb-friendly Samsung Internet × Safari Butterfly Liquid Glass browser for Android (Android 8.0+) with multi-tab browsing, built-in Ad Blocker, 6 HD wallpapers, Reader Mode, Desktop Site, QR scanner, and system-wide **Share → dejavu** to beam links/text straight to your PC
- **NEW: dejavu Link (PC ↔ Mobile E2EE Sync)** — Pair PC and Android with a QR code or short code (\`DJV-XXXX-XXXX\`). Send tabs, links, and text notes between PC and phone in real time (AES-256-CBC + HMAC-SHA256 encrypted over Wi-Fi & mobile data), view each other's open tabs, and sync Bookmarks & Reading List
- **macOS Safari Options Suite (\`Ctrl+,\`)** — 6 customization panes: Search Engines (Google, DuckDuckGo, Brave, Bing, Perplexity), Appearance Polarity, 6 Butterfly Accent Colors, Full URL mode, Compact Tab Bar, Default Zoom, Start Page toggles, and Browsing Data controls
- **26 Butterfly Studio HD & Live Themes** — 16 crisp 2K (\`2560×1440\`) dejavu artworks + 10 live 60fps themes + custom wallpaper upload
- **46-Country 3-Hop Encrypted VPN** & **100/100 Native Ad Blocker**

#### Downloads
- **\`dejavu-Setup.exe\`** — Windows 10/11 Guided Installer
- **\`dejavu.exe\`** — Windows 10/11 Portable Single-File
- **\`dejavu-mobile.apk\`** — Android Mobile Browser App (with PC ↔ Phone Sync)"
