name: Build & Release dejavu

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build dejavu.exe
        shell: pwsh
        run: .\build.ps1

      - name: Build dejavu-Setup.exe
        shell: pwsh
        run: .\build-setup.ps1

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dejavu-windows-x64
          path: |
            dist/dejavu.exe
            dist/dejavu-Setup.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Android release signing keystore
        run: |
          if [ -n "${{ secrets.DEJAVU_ANDROID_KEYSTORE_B64 }}" ]; then
            mkdir -p /tmp/dejavu-sign
            echo "${{ secrets.DEJAVU_ANDROID_KEYSTORE_B64 }}" | base64 -d > /tmp/dejavu-sign/dejavu-release.jks
            KS_PATH="/tmp/dejavu-sign/dejavu-release.jks"
            echo "Using repository secret signing keystore."
          else
            KS_PATH="$GITHUB_WORKSPACE/android/keystore/dejavu-release.jks"
            if [ ! -f "$KS_PATH" ]; then
              echo "ERROR: Persistent Android signing keystore missing at $KS_PATH" >&2
              exit 1
            fi
            echo "Using persistent repository signing keystore: $KS_PATH"
          fi
          echo "DEJAVU_KEYSTORE_PATH=$KS_PATH" >> "$GITHUB_ENV"
          LC_ALL=C keytool -list -v \
            -keystore "$KS_PATH" \
            -storepass "${{ secrets.DEJAVU_ANDROID_KEYSTORE_PASS || 'dejavu2026' }}" \
            -alias "${{ secrets.DEJAVU_ANDROID_KEY_ALIAS || 'dejavu' }}" | grep -E "Alias name:|Owner:|Valid from:|SHA256:"

      - name: Build signed dejavu-mobile.apk
        working-directory: android
        env:
          DEJAVU_KEYSTORE_PASS: ${{ secrets.DEJAVU_ANDROID_KEYSTORE_PASS || 'dejavu2026' }}
          DEJAVU_KEY_ALIAS: ${{ secrets.DEJAVU_ANDROID_KEY_ALIAS || 'dejavu' }}
          DEJAVU_KEY_PASS: ${{ secrets.DEJAVU_ANDROID_KEY_PASS || 'dejavu2026' }}
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/dejavu-mobile.apk
          ls -lh ../dist/dejavu-mobile.apk

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          echo "Using $APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs dist/dejavu-mobile.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dejavu-android-apk
          path: dist/dejavu-mobile.apk

  publish-release:
    needs: [build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: dejavu-windows-x64
          path: release-files

      - name: Download Android APK artifact
        uses: actions/download-artifact@v4
        with:
          name: dejavu-android-apk
          path: release-files

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          cat > /tmp/release_notes.md <<'EOF'
          ### dejavu __TAG__ — Multi-Window & Chrome-Style Simultaneous Multi-Profile Windows, Material Design 3 Google Account Sign-In/Sign-Up, 10-Category Material Design 3 Settings & Built-In YouTube 4K/MP3 Downloader

          - **True Multi-Window & Chrome-Style Simultaneous Multi-Profile Windows** — Open multiple `dejavu` browser windows at the same time in the same profile (`Ctrl+N`, `Ctrl+Shift+N` Private Window, or clicking the shortcut again with zero blank-black-window deadlock) AND run separate profiles (`Personal`, `Work`, etc.) simultaneously side-by-side in isolated processes with independent cookies, Google sessions, themes, and taskbar windows!
          - **Material Design 3 Google Account Sign-In / Sign-Up & Profile Setup (Windows & Android)** — Official Google Pixel Material Design 3 *"You & Google"* Hero Card and Profile Setup wizard with real **"Sign in with Google"** (`accounts.google.com`) and **"Create Google Account"** flows, automatic Google display name/email/avatar sync, local profile name & Material You color customization, Main Profile designation, and one-tap multi-profile switching.
          - **10-Category Authentic Google Pixel Material Design 3 Browser Settings** — Full live-searchable Material Design 3 Settings experience across Windows & Android: *You & Google*, *Appearance & Material You* (Light / Dark / Auto segmented toggle, 6 dynamic color seeds, 80%–150% text zoom, Request Desktop Site), *Privacy & Security* (dejavu Shield, HTTPS-First, Do Not Track, Block Pop-ups, Block Third-Party Cookies & real Clear Browsing Data dialog), *Search & Tabs* (Google, DuckDuckGo, Bing, Brave, Ecosia, Pull-to-Refresh, Background Links), *Downloads*, *Passwords & Autofill*, *Smart VPN*, *Accessibility & System*, *Sync*, and *About*.
          - **Built-In YouTube 4K/MP3 & 1,000+ Site Multi-Quality Downloader (Zero Extensions!)** — Pick exact qualities (`4K 2160p`, `1080p HD`, `720p HD`, `480p`, `360p`, or **`MP3 320k` / `Audio M4A`**) directly from the floating Material 3 download button or 8x Turbo Download Manager, with configurable default YouTube quality and floating button preferences.
          - **16 Pure Material Design 3 & 4 Butterfly M3 Wallpapers + Hardened Android V1+V2+V3 Release Signing** — 16 curated Google Pixel Material Design 3 wallpapers (including 4 matte ceramic Butterfly M3 artworks) + *Material You Live*, strictly zero CSS `blur(` or `backdrop-filter`, near-0% idle CPU, E2EE `dejavu Link` PC <-> Phone Sync, and permanent V1+V2+V3 Android release signing with `PackageInstaller.Session` in-place auto-updates.
            > **Android Upgrade Note:** Upgrading from `v4.2.0` or earlier? Uninstall dejavu once, then install `__TAG__` — **all future updates will install automatically in-place!**

          #### Downloads
          - **dejavu-Setup.exe** — Windows 10/11 Guided Installer
          - **dejavu.exe** — Windows 10/11 Portable Single-File
          - **dejavu-mobile.apk** — Android Mobile Browser App (V1+V2+V3 permanently signed, Android 8.0+)
          EOF
          sed -i 's/^          //' /tmp/release_notes.md
          sed -i "s/__TAG__/$TAG/g" /tmp/release_notes.md
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            release-files/dejavu-Setup.exe \
            release-files/dejavu.exe \
            release-files/dejavu-mobile.apk \
            --title "dejavu $TAG — Simultaneous Multi-Profile Windows, Material Design 3 Google Account & Settings, YouTube 4K/MP3 Downloader & 16 Pure M3 Wallpapers" \
            --notes-file /tmp/release_notes.md
