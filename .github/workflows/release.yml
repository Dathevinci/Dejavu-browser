name: Build & Release dejavu

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build dejavu.exe
        shell: pwsh
        run: .\build.ps1

      - name: Build dejavu-Setup.exe
        shell: pwsh
        run: .\build-setup.ps1

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dejavu-windows-x64
          path: |
            dist/dejavu.exe
            dist/dejavu-Setup.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Android release signing keystore
        run: |
          if [ -n "${{ secrets.DEJAVU_ANDROID_KEYSTORE_B64 }}" ]; then
            mkdir -p /tmp/dejavu-sign
            echo "${{ secrets.DEJAVU_ANDROID_KEYSTORE_B64 }}" | base64 -d > /tmp/dejavu-sign/dejavu-release.jks
            KS_PATH="/tmp/dejavu-sign/dejavu-release.jks"
            echo "Using repository secret signing keystore."
          else
            KS_PATH="$GITHUB_WORKSPACE/android/keystore/dejavu-release.jks"
            if [ ! -f "$KS_PATH" ]; then
              echo "ERROR: Persistent Android signing keystore missing at $KS_PATH" >&2
              exit 1
            fi
            echo "Using persistent repository signing keystore: $KS_PATH"
          fi
          echo "DEJAVU_KEYSTORE_PATH=$KS_PATH" >> "$GITHUB_ENV"
          LC_ALL=C keytool -list -v \
            -keystore "$KS_PATH" \
            -storepass "${{ secrets.DEJAVU_ANDROID_KEYSTORE_PASS || 'dejavu2026' }}" \
            -alias "${{ secrets.DEJAVU_ANDROID_KEY_ALIAS || 'dejavu' }}" | grep -E "Alias name:|Owner:|Valid from:|SHA256:"

      - name: Build signed dejavu-mobile.apk
        working-directory: android
        env:
          DEJAVU_KEYSTORE_PASS: ${{ secrets.DEJAVU_ANDROID_KEYSTORE_PASS || 'dejavu2026' }}
          DEJAVU_KEY_ALIAS: ${{ secrets.DEJAVU_ANDROID_KEY_ALIAS || 'dejavu' }}
          DEJAVU_KEY_PASS: ${{ secrets.DEJAVU_ANDROID_KEY_PASS || 'dejavu2026' }}
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/dejavu-mobile.apk
          ls -lh ../dist/dejavu-mobile.apk

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          echo "Using $APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs dist/dejavu-mobile.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dejavu-android-apk
          path: dist/dejavu-mobile.apk

  publish-release:
    needs: [build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: dejavu-windows-x64
          path: release-files

      - name: Download Android APK artifact
        uses: actions/download-artifact@v4
        with:
          name: dejavu-android-apk
          path: release-files

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          cat > /tmp/release_notes.md <<'EOF'
          ### dejavu __TAG__ — Built-In Multi-Quality YouTube & MP3 Downloader, 16 Pure Material Design 3 & Butterfly Wallpapers, and Hardened Android Signing

          - **Built-In YouTube & 1,000+ Site Multi-Quality Video & MP3/M4A Downloader (Zero Extensions!)** — Pick exact qualities (`4K 2160p`, `1080p HD`, `720p HD`, `480p`, `360p`, or **`MP3 320k` / `Audio M4A`**) directly from the floating Material 3 download button or Turbo Download Manager! Powered by auto-bootstrapped `yt-dlp` + `FFmpeg` on Windows and a native Java YouTube InnerTube multi-client resolver (`ANDROID` / `IOS` / `ANDROID_VR`) + Android `MediaMuxer` + 8x/HLS `.m3u8` engine on Android.
          - **16 Pure Material Design 3 Wallpapers (Including 4 Brand-New Butterfly Material Design 3 Wallpapers!)** — All old legacy wallpapers removed and replaced with 16 curated Google Pixel Material Design 3 wallpapers (12 Sculptural/Architectural + 4 Matte Ceramic Butterfly M3 wallpapers: *Amethyst Origami*, *Pixel Morpho*, *Porcelain Wings*, *Botanical Sage*) + *Material You Live*, synced across Windows, Android, and the official website.
          - **Hardened Android V1+V2+V3 Release Signing & `PackageInstaller.Session` Updater** — Signed with our permanent release keystore (`dejavu-release.jks`) using V1 + V2 + V3 APK signing for Samsung One UI 7 / Android 14–16 compatibility, upgraded `MobileAutoUpdater` with Android `PackageInstaller.Session` status reporting, clear older-key upgrade instructions, and an **"Open APK in Files / Share APK"** fallback saving to `Downloads/dejavu/`.
            > **Android Upgrade Note:** Upgrading from `v4.2.0` or earlier? Uninstall dejavu once, then install `__TAG__` — **all future updates will install automatically in-place!**
          - **Pure Google Pixel Material Design 3 & Near-0% Idle CPU** — Crisp HCT surface containers, strictly zero CSS `blur(` or `backdrop-filter`, `~0.85%` idle CPU, 86-Country AI-Ready Smart VPN, 100/100 Ad Blocker (279k+ rules), and E2EE `dejavu Link` PC <-> Phone Sync.

          #### Downloads
          - **dejavu-Setup.exe** — Windows 10/11 Guided Installer
          - **dejavu.exe** — Windows 10/11 Portable Single-File
          - **dejavu-mobile.apk** — Android Mobile Browser App (V1+V2+V3 permanently signed, Android 8.0+)
          EOF
          sed -i 's/^          //' /tmp/release_notes.md
          sed -i "s/__TAG__/$TAG/g" /tmp/release_notes.md
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            release-files/dejavu-Setup.exe \
            release-files/dejavu.exe \
            release-files/dejavu-mobile.apk \
            --title "dejavu $TAG — Built-In YouTube Quality & MP3 Downloader, 16 Pure Material Design 3 & Butterfly Wallpapers & Hardened Android Signing" \
            --notes-file /tmp/release_notes.md
