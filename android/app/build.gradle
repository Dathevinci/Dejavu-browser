plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dathevinci.dejavu'
    compileSdk 35

    defaultConfig {
        applicationId "com.dathevinci.dejavu"
        minSdk 26
        targetSdk 35
        versionCode 320
        versionName "3.2.0"
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("DEJAVU_KEYSTORE_PATH")
            if (ksPath != null && file(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword System.getenv("DEJAVU_KEYSTORE_PASS") ?: "dejavu2026"
                keyAlias System.getenv("DEJAVU_KEY_ALIAS") ?: "dejavu"
                keyPassword System.getenv("DEJAVU_KEY_PASS") ?: "dejavu2026"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
        debug {
            applicationIdSuffix ""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
