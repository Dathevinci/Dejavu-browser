name: Build & Release dejavu

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build dejavu.exe
        shell: pwsh
        run: .\build.ps1

      - name: Build dejavu-Setup.exe
        shell: pwsh
        run: .\build-setup.ps1

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dejavu-windows-x64
          path: |
            dist/dejavu.exe
            dist/dejavu-Setup.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Android release signing keystore
        run: |
          if [ -n "${{ secrets.DEJAVU_ANDROID_KEYSTORE_B64 }}" ]; then
            mkdir -p /tmp/dejavu-sign
            echo "${{ secrets.DEJAVU_ANDROID_KEYSTORE_B64 }}" | base64 -d > /tmp/dejavu-sign/dejavu-release.jks
            KS_PATH="/tmp/dejavu-sign/dejavu-release.jks"
            echo "Using repository secret signing keystore."
          else
            KS_PATH="$GITHUB_WORKSPACE/android/keystore/dejavu-release.jks"
            if [ ! -f "$KS_PATH" ]; then
              echo "ERROR: Persistent Android signing keystore missing at $KS_PATH" >&2
              exit 1
            fi
            echo "Using persistent repository signing keystore: $KS_PATH"
          fi
          echo "DEJAVU_KEYSTORE_PATH=$KS_PATH" >> "$GITHUB_ENV"
          LC_ALL=C keytool -list -v \
            -keystore "$KS_PATH" \
            -storepass "${{ secrets.DEJAVU_ANDROID_KEYSTORE_PASS || 'dejavu2026' }}" \
            -alias "${{ secrets.DEJAVU_ANDROID_KEY_ALIAS || 'dejavu' }}" | grep -E "Alias name:|Owner:|Valid from:|SHA256:"

      - name: Build signed dejavu-mobile.apk
        working-directory: android
        env:
          DEJAVU_KEYSTORE_PASS: ${{ secrets.DEJAVU_ANDROID_KEYSTORE_PASS || 'dejavu2026' }}
          DEJAVU_KEY_ALIAS: ${{ secrets.DEJAVU_ANDROID_KEY_ALIAS || 'dejavu' }}
          DEJAVU_KEY_PASS: ${{ secrets.DEJAVU_ANDROID_KEY_PASS || 'dejavu2026' }}
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/dejavu-mobile.apk
          ls -lh ../dist/dejavu-mobile.apk

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          echo "Using $APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs dist/dejavu-mobile.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dejavu-android-apk
          path: dist/dejavu-mobile.apk

  publish-release:
    needs: [build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: dejavu-windows-x64
          path: release-files

      - name: Download Android APK artifact
        uses: actions/download-artifact@v4
        with:
          name: dejavu-android-apk
          path: release-files

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          cat > /tmp/release_notes.md <<'EOF'
          ### dejavu __TAG__ — Thorough Material Design 3 Polish, Zero-Duplicate Chrome & Navigation Rail, Live Multi-Profile Sync & Streamlined Android Pixel Settings

          - **Zero-Duplicate Decluttered Chrome + Navigation Rail UI (Windows)** — Eliminated every duplicate icon between the Top Toolbar and Left Navigation Rail: clean Chrome Material 3 top bar (`Back / Forward / Reload`, Pill Omnibox, `VPN` pill, `Profile` pill, `3-Dot Menu`) paired with a single-instance Left Navigation Rail (`New Tab FAB`, `Start Page`, `Side Panel`, `Downloads`, `Sync`, `History`, and one bottom-anchored `Settings` gear) — plus automatic fallback when hiding the rail and zero duplicate rows across all 10 Settings categories.
          - **Live Cross-Process Multi-Profile Sync & Google Account Polish** — Open 2+ simultaneous browser windows (`Ctrl+N`, `Ctrl+Shift+N` Private) and run separate profiles (`Personal`, `Work`) side-by-side with real-time cross-process `REFRESH_PROFILES` sync, `Ctrl+Shift+M` Profile Switcher shortcut, Material 3 Toast feedback, and stronger Google Account name/email/avatar auto-sync.
          - **Streamlined Android Pixel Material Design 3 Settings & You & Google Card** — Deduplicated the Android Settings & Profile flows into one crisp Google Pixel Material Design 3 Account Card (`Sign in with Google` / `Create Google Account` + quick single-row profile switcher chips + `+ Add`), upgraded tonal Light & Dark surface container contrast, live Settings Search match counts & category badges, and `52x32` M3 checkmark switches.
          - **Thorough Material Design 3 Official Website (`docs/`)** — Elevated the official website with authentic M3 HCT tonal surface elevation across all 6 Dynamic Color Seeds in both Dark and Light modes, M3 Top App Bar with active pill indicator & Dark/Light segmented pill, and an upgraded Hero Dual-Device Showcase mirroring the decluttered `__TAG__` zero-duplicate Chrome + Navigation Rail UI.
          - **Built-In YouTube 4K/MP3 Downloader, 16 Pure M3 & Butterfly Wallpapers & Permanent V1–V3 Android Signing** — Download `4K / 1080p / 720p MP4` or `MP3 320k / M4A` natively with zero extensions, enjoy 16 curated Material Design 3 & 4 Butterfly M3 wallpapers + *Material You Live*, strictly zero CSS `blur(` or `backdrop-filter`, near-0% idle CPU, 86-country AI-ready Smart VPN + 3-Hop Tor, E2EE `dejavu Link` PC <-> Phone Sync, and permanent V1+V2+V3 Android signing with `PackageInstaller.Session` in-place auto-updates.
            > **Android Upgrade Note:** Upgrading from `v4.2.0` or earlier? Uninstall dejavu once, then install `__TAG__` — **all future updates will install automatically in-place!**

          #### Downloads
          - **dejavu-Setup.exe** — Windows 10/11 Guided Installer
          - **dejavu.exe** — Windows 10/11 Portable Single-File
          - **dejavu-mobile.apk** — Android Mobile Browser App (V1+V2+V3 permanently signed, Android 8.0+)
          EOF
          sed -i 's/^          //' /tmp/release_notes.md
          sed -i "s/__TAG__/$TAG/g" /tmp/release_notes.md
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            release-files/dejavu-Setup.exe \
            release-files/dejavu.exe \
            release-files/dejavu-mobile.apk \
            --title "dejavu $TAG — Thorough Material Design 3 Polish, Zero-Duplicate UI, Live Multi-Profile Sync & Streamlined Pixel Settings" \
            --notes-file /tmp/release_notes.md
