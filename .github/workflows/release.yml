name: Build & Release dejavu

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build dejavu.exe
        shell: pwsh
        run: .\build.ps1

      - name: Build dejavu-Setup.exe
        shell: pwsh
        run: .\build-setup.ps1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dejavu-windows-x64
          path: |
            dist/dejavu.exe
            dist/dejavu-Setup.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag `
            dist\dejavu-Setup.exe `
            dist\dejavu.exe `
            --title "dejavu $tag" `
            --notes "### dejavu $tag — Native Liquid Glass Browser for Windows`n`n- **Automatic Self-Updater** — Silently checks GitHub Releases and updates installed dejavu apps in-place with one click (*Restart & Update*)`n- **Chrome-Style Isolated Profiles + 16 Butterfly Avatars** — Create/switch profiles with separate logins, history, favorites, wallpapers & 16 collectible butterfly profile pics`n- **Top Bar Favorites & Browsing History** — Pin favorite websites (`Ctrl+D`) to a sleek auto-appearing Liquid Glass Favorites Bar & search/manage history (`Ctrl+H`)`n- **Fluid Spring Animations & Polish** — Smooth elastic animations across tabs, stars, popovers, and New Tab`n- **100/100 Ad Blocker** — 279,000+ domains (OISD Big + EasyList + EasyPrivacy + uBlock Origin + Peter Lowe) + 8,400+ per-site cosmetic rules + YouTube ad shield`n- **Butterfly Studio** — 4 crystal butterfly artworks, 6 live 60fps themes, + custom wallpaper upload`n- **dejavu-Setup.exe** — Butterfly-themed Liquid Glass installer (no admin rights needed)`n- **dejavu.exe** — Standalone single-file native Chromium WebView2 browser"
