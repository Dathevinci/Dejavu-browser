name: Build & Release dejavu

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build dejavu.exe
        shell: pwsh
        run: .\build.ps1

      - name: Build dejavu-Setup.exe
        shell: pwsh
        run: .\build-setup.ps1

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dejavu-windows-x64
          path: |
            dist/dejavu.exe
            dist/dejavu-Setup.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Android release signing keystore
        run: |
          if [ -n "${{ secrets.DEJAVU_ANDROID_KEYSTORE_B64 }}" ]; then
            mkdir -p /tmp/dejavu-sign
            echo "${{ secrets.DEJAVU_ANDROID_KEYSTORE_B64 }}" | base64 -d > /tmp/dejavu-sign/dejavu-release.jks
            KS_PATH="/tmp/dejavu-sign/dejavu-release.jks"
            echo "Using repository secret signing keystore."
          else
            KS_PATH="$GITHUB_WORKSPACE/android/keystore/dejavu-release.jks"
            if [ ! -f "$KS_PATH" ]; then
              echo "ERROR: Persistent Android signing keystore missing at $KS_PATH" >&2
              exit 1
            fi
            echo "Using persistent repository signing keystore: $KS_PATH"
          fi
          echo "DEJAVU_KEYSTORE_PATH=$KS_PATH" >> "$GITHUB_ENV"
          LC_ALL=C keytool -list -v \
            -keystore "$KS_PATH" \
            -storepass "${{ secrets.DEJAVU_ANDROID_KEYSTORE_PASS || 'dejavu2026' }}" \
            -alias "${{ secrets.DEJAVU_ANDROID_KEY_ALIAS || 'dejavu' }}" | grep -E "Alias name:|Owner:|Valid from:|SHA256:"

      - name: Build signed dejavu-mobile.apk
        working-directory: android
        env:
          DEJAVU_KEYSTORE_PASS: ${{ secrets.DEJAVU_ANDROID_KEYSTORE_PASS || 'dejavu2026' }}
          DEJAVU_KEY_ALIAS: ${{ secrets.DEJAVU_ANDROID_KEY_ALIAS || 'dejavu' }}
          DEJAVU_KEY_PASS: ${{ secrets.DEJAVU_ANDROID_KEY_PASS || 'dejavu2026' }}
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/dejavu-mobile.apk
          ls -lh ../dist/dejavu-mobile.apk

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          echo "Using $APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs dist/dejavu-mobile.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dejavu-android-apk
          path: dist/dejavu-mobile.apk

  publish-release:
    needs: [build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: dejavu-windows-x64
          path: release-files

      - name: Download Android APK artifact
        uses: actions/download-artifact@v4
        with:
          name: dejavu-android-apk
          path: release-files

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          cat > /tmp/release_notes.md <<'EOF'
          ### dejavu __TAG__ — 24 Pure M3 Wallpapers, 12 Material You Themes, Pixel At-a-Glance & ChromeOS Polish

          - **12 Google Material Design 3 HCT Color Themes + 24 Pure M3 & 6 Butterfly Wallpapers (Auto-Harmonizing!)**:
            - **12 Complete Dark & Light HCT Palettes** — Amethyst, Pixel Blue, Royal Indigo, Aurora Teal, Botanical Jade, Matcha Olive, Honey Amber, Sunset Coral, Crimson Clay, Velvet Rose, Orchid Mist, and Titanium Slate across Windows, Android & Web (strictly zero CSS blur).
            - **24 Sculpted HD Wallpapers (8 Brand-New Editions)** — Expanded from 16 to **24 Pure M3 HD wallpapers** (`1920×1080`), adding `Crimson Fold`, `Jade Terrace`, `Cobalt Prism`, `Coral Bloom`, `Lavender Mist`, `Mint Atelier`, plus 2 new **Butterfly M3** ceramic editions (`Coral Monarch` & `Emerald Swallowtail`, 6 Butterfly M3 wallpapers total!).
            - **Automatic Wallpaper-to-Theme Matching (Pixel *Wallpaper & Style*)** — Picking any wallpaper automatically transforms both your browser's Material You color seed AND Dark/Light polarity (with dominant color sampling for custom uploaded images on Windows, toggleable in Settings → Appearance).
          - **Redesigned Pixel Material Design 3 At-a-Glance Message of the Day Card** — Unified greeting, date, and daily thought into one calm, elevated Google Pixel At-a-Glance M3 card on both Windows and Android with a soft `primaryContainer` time-of-day medallion and 1-tap rotating refresh button.
          - **Decluttered ChromeOS 5-Icon Toolbar, Scroll-Free `⋮` Menu, Overhauled VPN Popover & Material Symbols Rounded**:
            - **Breathable ChromeOS Right Toolbar** — Always shows at most 5 clean controls (`VPN`, `Downloads`, `Extensions`, compact `Profile` with zero redundant `Main` pill, and `⋮ Menu`) even when the Navigation Rail hides!
            - **Zero-Scrollbar `⋮` Menu & Overhauled M3 VPN Popover** — Cleanly grouped ChromeOS `⋮` Menu with zero scrollbars and zero truncated labels, plus an overhauled M3 VPN popover with a tactile `60px` circular Power/Shield toggle, search pill, filter chips, and sleek `5px` themed scrollbars.
            - **Unified Google Material Symbols Rounded Iconography** — Crisp `24×24` Material Symbols Rounded icons everywhere — including the brand-new **6-tooth rounded Settings Gear** and **VPN Shield-Globe**.
          - **100%-Verified Brave-Exact Shields Engine & Flagship Ecosystem** — Native Chromium `ERR_BLOCKED_BY_CLIENT` + `FrameNavigationStarting` ad-iframe cancellation, **`279K+` Windows / `108K+` Android** Brave/EasyList/EasyPrivacy/uBlock/OISD rules + `document_start` scriptlets (100% d3ward & 100/100 adblock-tester parity), deep YouTube JSON-prune + instant video-event ad skipping + Brave `ima3.js` surrogates, popunder blocking, URL cleaning, farbling & Fanboy cookies; real-time **dejavu Link** (Direct Wi-Fi LAN + TLS MQTT Retained E2EE); Smooth Win 11 8-edge resize & Snap; Zero-Lag 120Hz anti-glitch tabs; Windows Hello & Android Passkeys + Universal M3 OAuth Popups; Real Chrome MV3 Extensions & Android Userscripts; YouTube `4K / 1080p / 720p / MP3 320k` 8× Turbo Downloader; 86-country Smart VPN + 3-Hop Tor; `<1%` idle CPU; and permanent V1+V2+V3 Android signing with in-place auto-updates.
            > **Android Upgrade Note:** Upgrading from `v4.2.0` or earlier? Uninstall dejavu once, then install `__TAG__` — **all future updates will install automatically in-place!**

          #### Downloads
          - **dejavu-Setup.exe** — Windows 10/11 Guided Installer (12 Material You HCT Themes, 24 Pure M3 & 6 Butterfly Wallpapers with auto-theme matching, Redesigned Pixel M3 At-a-Glance MOTD, Decluttered 5-Icon ChromeOS Toolbar & Overhauled M3 Menu/VPN Popovers, Material Symbols Rounded Icons, 100%-verified Brave-Exact Shields Engine `279K+` rules & Real-Time Link Sync)
          - **dejavu.exe** — Windows 10/11 Portable Single-File
          - **dejavu-mobile.apk** — Android Mobile Browser App (12 Material You HCT Themes, 24 Pure M3 & 6 Butterfly Wallpapers with auto-theme matching, Redesigned Pixel M3 At-a-Glance MOTD, Material Symbols Rounded Icons, Brave-Exact Shields Engine `108K+` cached rules + `document_start` scriptlets, Direct LAN + TLS MQTT E2EE Link Sync, V1+V2+V3 permanently signed, Android 8.0+)
          EOF
          sed -i 's/^          //' /tmp/release_notes.md
          sed -i "s/__TAG__/$TAG/g" /tmp/release_notes.md
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            release-files/dejavu-Setup.exe \
            release-files/dejavu.exe \
            release-files/dejavu-mobile.apk \
            --title "dejavu $TAG — 24 M3 Wallpapers, 12 Material You Themes, Pixel At-a-Glance & Brave-Exact Shields" \
            --notes-file /tmp/release_notes.md
