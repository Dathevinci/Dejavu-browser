name: Build & Release dejavu

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build dejavu.exe
        shell: pwsh
        run: .\build.ps1

      - name: Build dejavu-Setup.exe
        shell: pwsh
        run: .\build-setup.ps1

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dejavu-windows-x64
          path: |
            dist/dejavu.exe
            dist/dejavu-Setup.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Android release signing keystore
        run: |
          if [ -n "${{ secrets.DEJAVU_ANDROID_KEYSTORE_B64 }}" ]; then
            mkdir -p /tmp/dejavu-sign
            echo "${{ secrets.DEJAVU_ANDROID_KEYSTORE_B64 }}" | base64 -d > /tmp/dejavu-sign/dejavu-release.jks
            KS_PATH="/tmp/dejavu-sign/dejavu-release.jks"
            echo "Using repository secret signing keystore."
          else
            KS_PATH="$GITHUB_WORKSPACE/android/keystore/dejavu-release.jks"
            if [ ! -f "$KS_PATH" ]; then
              echo "ERROR: Persistent Android signing keystore missing at $KS_PATH" >&2
              exit 1
            fi
            echo "Using persistent repository signing keystore: $KS_PATH"
          fi
          echo "DEJAVU_KEYSTORE_PATH=$KS_PATH" >> "$GITHUB_ENV"
          LC_ALL=C keytool -list -v \
            -keystore "$KS_PATH" \
            -storepass "${{ secrets.DEJAVU_ANDROID_KEYSTORE_PASS || 'dejavu2026' }}" \
            -alias "${{ secrets.DEJAVU_ANDROID_KEY_ALIAS || 'dejavu' }}" | grep -E "Alias name:|Owner:|Valid from:|SHA256:"

      - name: Build signed dejavu-mobile.apk
        working-directory: android
        env:
          DEJAVU_KEYSTORE_PASS: ${{ secrets.DEJAVU_ANDROID_KEYSTORE_PASS || 'dejavu2026' }}
          DEJAVU_KEY_ALIAS: ${{ secrets.DEJAVU_ANDROID_KEY_ALIAS || 'dejavu' }}
          DEJAVU_KEY_PASS: ${{ secrets.DEJAVU_ANDROID_KEY_PASS || 'dejavu2026' }}
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/dejavu-mobile.apk
          ls -lh ../dist/dejavu-mobile.apk

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          echo "Using $APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs dist/dejavu-mobile.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dejavu-android-apk
          path: dist/dejavu-mobile.apk

  publish-release:
    needs: [build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: dejavu-windows-x64
          path: release-files

      - name: Download Android APK artifact
        uses: actions/download-artifact@v4
        with:
          name: dejavu-android-apk
          path: release-files

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          cat > /tmp/release_notes.md <<'EOF'
          ### dejavu __TAG__ — A-to-Z Simple Material Design 3, Fixed 8x Video & HLS Downloader & Permanent Android Signing

          - **A-to-Z Google Pixel Material Design 3 (Windows, Android & Website)** — Pure HCT tonal surface container hierarchy (`surface` -> `surface-container-highest`), 6 Dynamic Material You color seeds across Dark & Light polarity, fluid GPU-composited `Emphasized Decelerate` motion, Samsung M3 Left Navigation Rail, and strictly zero CSS blur or heavy glassmorphism.
          - **Fixed AntDM-Class 8x Video & HLS `.m3u8` Downloader (Windows & Android)** — Native HLS master/media playlist resolver + multi-threaded `.ts`/fMP4 segment downloader with AES-128 decryption & video assembly, YouTube / MSE `googlevideo.com` `&range=` stripping + `ytInitialPlayerResponse` format extraction, bulletproof `301/302/303/307/308` redirect & header preservation, chunked unknown-length support, and automatic single-stream fallback when servers reject `Range` requests.
          - **Permanent Android Signing Key (Fixes `"It cannot be installed"` Update Error)** — Checked-in persistent release keystore (`dejavu-release.jks`), `FileProvider` `Download/` fix, and pre-install APK ZIP/PackageArchiveInfo/signature verification in `MobileAutoUpdater`.
            > **Android Upgrade Note:** If upgrading from `v4.2.0` or earlier shows *"Cannot be installed"* (due to earlier ephemeral CI signing keys), uninstall the old app once and install `__TAG__` — **all future updates will install seamlessly in-place with a permanent signing key!**
          - **8 Brand-New Material Design 3 Architectural Wallpapers** — *Obsidian Monolith*, *Cobalt Ribbons*, *Eucalyptus Calm*, *Velvet Petals*, *Ochre Solitude* (Dark) and *Porcelain Steps*, *Jade Pebbles*, *Terracotta Ribbon* (Light) — synced across Windows, Android, and the redesigned Simple Material Design 3 website.
          - **Near-0% Idle CPU & Native Speed** — Eliminated background screenshot/blur loops and polling `setInterval` timers on both Windows (`~0.85%` idle CPU) and Android, while keeping the 86-Country AI-Ready Smart VPN, 100/100 Ad Blocker (279k+ rules), and E2EE `dejavu Link` PC <-> Phone Sync.

          #### Downloads
          - **dejavu-Setup.exe** — Windows 10/11 Guided Installer
          - **dejavu.exe** — Windows 10/11 Portable Single-File
          - **dejavu-mobile.apk** — Android Mobile Browser App (permanently signed, Android 8.0+)
          EOF
          sed -i 's/^          //' /tmp/release_notes.md
          sed -i "s/__TAG__/$TAG/g" /tmp/release_notes.md
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            release-files/dejavu-Setup.exe \
            release-files/dejavu.exe \
            release-files/dejavu-mobile.apk \
            --title "dejavu $TAG — A-to-Z Material Design 3, Fixed 8x Video/HLS Downloader & Permanent Android Signing" \
            --notes-file /tmp/release_notes.md
