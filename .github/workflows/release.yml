name: Build & Release dejavu

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build dejavu.exe
        shell: pwsh
        run: .\build.ps1

      - name: Build dejavu-Setup.exe
        shell: pwsh
        run: .\build-setup.ps1

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dejavu-windows-x64
          path: |
            dist/dejavu.exe
            dist/dejavu-Setup.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Android release signing keystore
        run: |
          if [ -n "${{ secrets.DEJAVU_ANDROID_KEYSTORE_B64 }}" ]; then
            mkdir -p /tmp/dejavu-sign
            echo "${{ secrets.DEJAVU_ANDROID_KEYSTORE_B64 }}" | base64 -d > /tmp/dejavu-sign/dejavu-release.jks
            KS_PATH="/tmp/dejavu-sign/dejavu-release.jks"
            echo "Using repository secret signing keystore."
          else
            KS_PATH="$GITHUB_WORKSPACE/android/keystore/dejavu-release.jks"
            if [ ! -f "$KS_PATH" ]; then
              echo "ERROR: Persistent Android signing keystore missing at $KS_PATH" >&2
              exit 1
            fi
            echo "Using persistent repository signing keystore: $KS_PATH"
          fi
          echo "DEJAVU_KEYSTORE_PATH=$KS_PATH" >> "$GITHUB_ENV"
          LC_ALL=C keytool -list -v \
            -keystore "$KS_PATH" \
            -storepass "${{ secrets.DEJAVU_ANDROID_KEYSTORE_PASS || 'dejavu2026' }}" \
            -alias "${{ secrets.DEJAVU_ANDROID_KEY_ALIAS || 'dejavu' }}" | grep -E "Alias name:|Owner:|Valid from:|SHA256:"

      - name: Build signed dejavu-mobile.apk
        working-directory: android
        env:
          DEJAVU_KEYSTORE_PASS: ${{ secrets.DEJAVU_ANDROID_KEYSTORE_PASS || 'dejavu2026' }}
          DEJAVU_KEY_ALIAS: ${{ secrets.DEJAVU_ANDROID_KEY_ALIAS || 'dejavu' }}
          DEJAVU_KEY_PASS: ${{ secrets.DEJAVU_ANDROID_KEY_PASS || 'dejavu2026' }}
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/dejavu-mobile.apk
          ls -lh ../dist/dejavu-mobile.apk

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          echo "Using $APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs dist/dejavu-mobile.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dejavu-android-apk
          path: dist/dejavu-mobile.apk

  publish-release:
    needs: [build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: dejavu-windows-x64
          path: release-files

      - name: Download Android APK artifact
        uses: actions/download-artifact@v4
        with:
          name: dejavu-android-apk
          path: release-files

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          cat > /tmp/release_notes.md <<'EOF'
          ### dejavu __TAG__ — Material Design 3 Context Menus, Fluid M3 Motion Everywhere & Native Windows + Android Default Browser

          - **Material Design 3 Right-Click & Long-Press Context Menus (Windows & Android)** — Full native `CoreWebView2` Material Design 3 right-click menus on Windows (webpages, links, images, selections, inputs, media, tabs, Start Page, Quick Access & omnibox) plus Google Pixel Material Design 3 **Long-Press Context Menu Bottom Sheets** on Android (links, images, Quick Access shortcuts & Tab Switcher cards) with one-tap **Turbo 8× Download**, Share, and **Send to PC (`dejavu Link`)**.
          - **Fluid Material Design 3 Emphasized & Spring Motion Everywhere** — Smooth GPU-composited `transform`/`opacity` animations across bottom sheets, right-click menus, `52×32` checkmark switches, segmented pills, tab cards, progress bars, and website scroll-reveal choreography — 100% `prefers-reduced-motion` safe and strictly zero CSS `blur(` or `backdrop-filter`.
          - **Native Windows 10/11 & Android Default Browser Registration** — Complete Windows 10/11 `RegisteredApplications` + `StartMenuInternet\dejavu\Capabilities` + `DejavuHTML` ProgID registration with a dedicated Settings card, plus Android `APP_BROWSER` + MIME-typed `VIEW` intent-filters and official `RoleManager` (`ROLE_BROWSER`) Default Browser support in Android Settings.
          - **Zero-Duplicate Chrome + Navigation Rail, Simultaneous Multi-Profile Google Windows & YouTube 4K/MP3 Downloader** — Decluttered single-instance Chrome + Left Navigation Rail, zero duplicate rows across all 10 searchable M3 Settings categories, live cross-process Multi-Profile windows (`Ctrl+N`, `Ctrl+Shift+N`, `Ctrl+Shift+M`), built-in YouTube & 1,000+ site `4K / 1080p / 720p / MP3 320k` downloader with 8× acceleration & HLS `.m3u8` assembly, 16 Pure Material 3 & 4 Butterfly M3 wallpapers, 86-country AI-ready Smart VPN + 3-Hop Tor, E2EE PC <-> Phone Sync, and permanent V1+V2+V3 Android signing with `PackageInstaller.Session` in-place auto-updates.
            > **Android Upgrade Note:** Upgrading from `v4.2.0` or earlier? Uninstall dejavu once, then install `__TAG__` — **all future updates will install automatically in-place!**

          #### Downloads
          - **dejavu-Setup.exe** — Windows 10/11 Guided Installer (with Default Browser registration)
          - **dejavu.exe** — Windows 10/11 Portable Single-File
          - **dejavu-mobile.apk** — Android Mobile Browser App (V1+V2+V3 permanently signed, Android 8.0+)
          EOF
          sed -i 's/^          //' /tmp/release_notes.md
          sed -i "s/__TAG__/$TAG/g" /tmp/release_notes.md
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            release-files/dejavu-Setup.exe \
            release-files/dejavu.exe \
            release-files/dejavu-mobile.apk \
            --title "dejavu $TAG — Material Design 3 Context Menus, Fluid M3 Motion & Native Default Browser" \
            --notes-file /tmp/release_notes.md
