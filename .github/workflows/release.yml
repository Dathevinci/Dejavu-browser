name: Build & Release dejavu

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build dejavu.exe
        shell: pwsh
        run: .\build.ps1

      - name: Build dejavu-Setup.exe
        shell: pwsh
        run: .\build-setup.ps1

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dejavu-windows-x64
          path: |
            dist/dejavu.exe
            dist/dejavu-Setup.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Android release signing keystore
        run: |
          if [ -n "${{ secrets.DEJAVU_ANDROID_KEYSTORE_B64 }}" ]; then
            mkdir -p /tmp/dejavu-sign
            echo "${{ secrets.DEJAVU_ANDROID_KEYSTORE_B64 }}" | base64 -d > /tmp/dejavu-sign/dejavu-release.jks
            KS_PATH="/tmp/dejavu-sign/dejavu-release.jks"
            echo "Using repository secret signing keystore."
          else
            KS_PATH="$GITHUB_WORKSPACE/android/keystore/dejavu-release.jks"
            if [ ! -f "$KS_PATH" ]; then
              echo "ERROR: Persistent Android signing keystore missing at $KS_PATH" >&2
              exit 1
            fi
            echo "Using persistent repository signing keystore: $KS_PATH"
          fi
          echo "DEJAVU_KEYSTORE_PATH=$KS_PATH" >> "$GITHUB_ENV"
          LC_ALL=C keytool -list -v \
            -keystore "$KS_PATH" \
            -storepass "${{ secrets.DEJAVU_ANDROID_KEYSTORE_PASS || 'dejavu2026' }}" \
            -alias "${{ secrets.DEJAVU_ANDROID_KEY_ALIAS || 'dejavu' }}" | grep -E "Alias name:|Owner:|Valid from:|SHA256:"

      - name: Build signed dejavu-mobile.apk
        working-directory: android
        env:
          DEJAVU_KEYSTORE_PASS: ${{ secrets.DEJAVU_ANDROID_KEYSTORE_PASS || 'dejavu2026' }}
          DEJAVU_KEY_ALIAS: ${{ secrets.DEJAVU_ANDROID_KEY_ALIAS || 'dejavu' }}
          DEJAVU_KEY_PASS: ${{ secrets.DEJAVU_ANDROID_KEY_PASS || 'dejavu2026' }}
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/dejavu-mobile.apk
          ls -lh ../dist/dejavu-mobile.apk

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          echo "Using $APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs dist/dejavu-mobile.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dejavu-android-apk
          path: dist/dejavu-mobile.apk

  publish-release:
    needs: [build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: dejavu-windows-x64
          path: release-files

      - name: Download Android APK artifact
        uses: actions/download-artifact@v4
        with:
          name: dejavu-android-apk
          path: release-files

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          cat > /tmp/release_notes.md <<'EOF'
          ### dejavu __TAG__ — Collapsible M3 Butterfly Video FAB, dejavu Link v2.3 Continuity Hub & 120Hz Android Polish

          - **Collapsible Material Design 3 Butterfly Video Downloader FAB (Windows & Android)**:
            - **Zero Video Obstruction at Rest** — Tucks cleanly into the video corner as an unobtrusive **`34×34px` sculpted Material Design 3 Butterfly logo** (100% Trusted Types CSP-safe SVG on YouTube & 1,000+ sites).
            - **Smooth On-Click Expansion** — Click the Butterfly to expand cleanly into **`4K / 1080p / 720p` MP4**, **`320k` MP3** audio extraction, and **Send-to-Phone / PC** video timestamp handoff controls with 8× parallel byte-range acceleration & HLS `.m3u8` assembly, then smoothly auto-collapses back to the compact Butterfly badge!
          - **Expanded `dejavu Link v2.3` Cross-Device Continuity Hub (Direct Wi-Fi LAN + TLS MQTT E2EE)**:
            - **Send All Open Tabs** in one click, **Continue Watching** video timestamp handoff (`?t=...`), and **Remote 8× Download Handoff** directly between Windows & Android.
            - **10-Item Shared Clipboard History**, **Retained E2EE Pinned Cross-Device Notes**, and **1-Tap Ping / Find Device** over Direct Wi-Fi LAN auto-discovery + TLS MQTT Retained AES-256 E2EE (zero rate limits).
          - **Buttery 120Hz Android Scrolling & Zero-Overlap Edge-to-Edge Polish (`__TAG__` · `versionCode 550`)**:
            - Eliminated mid-scroll viewport resize loops and pull-to-refresh touch hijacking for silky, locked **120Hz scrolling**.
            - Added **IME keyboard-aware** bottom sheets & webpage viewport resizing, a **non-overlapping top-tucked scroll pill**, and a sleek refreshed **Android Material Design 3 Link Hub**.
          - **Flagship Material Design 3 Ecosystem & Brave-Exact Shields**:
            - **12 Material You HCT Color Themes & 24 Pure M3 / 6 Butterfly HD Wallpapers** with automatic wallpaper-to-theme harmonizing, Pixel M3 At-a-Glance MOTD card, breathable 5-icon ChromeOS toolbar, zero-scrollbar `⋮` Menu & overhauled M3 VPN popover, and Google Material Symbols Rounded icons (strictly zero CSS blur).
            - **100%-Verified Brave-Exact Shields Engine** (`ERR_BLOCKED_BY_CLIENT` + `FrameNavigationStarting` ad-iframe cancellation, **`279K+` Windows / `108K+` Android** rules + `document_start` scriptlets, 100% d3ward & 100/100 adblock-tester, deep YouTube JSON-prune + instant ad skip + `ima3.js` surrogates, popunder blocking, farbling & Fanboy cookies), Windows Hello & Android Passkeys + Universal M3 OAuth Popups, Real Chrome MV3 Extensions & Android Userscripts, 86-country Smart VPN + 3-Hop Tor, `<1%` idle CPU, and permanent V1+V2+V3 Android signing with in-place auto-updates.
            > **Android Upgrade Note (`__TAG__`, `versionCode 550`):** Upgrading from `v4.2.0` or earlier? Uninstall dejavu once, then install `__TAG__` — **all future updates will install automatically in-place!**

          #### Downloads
          - **dejavu-Setup.exe** — Windows 10/11 Guided Installer (Collapsible `34×34px` M3 Butterfly Video Downloader FAB, Expanded `dejavu Link v2.3` Continuity Hub, 12 Material You HCT Themes & 24 Pure M3 / 6 Butterfly Wallpapers, Pixel M3 At-a-Glance MOTD, 5-Icon ChromeOS Toolbar, 100%-verified Brave-Exact Shields `279K+` rules & Real Chrome MV3 Extensions)
          - **dejavu.exe** — Windows 10/11 Portable Single-File
          - **dejavu-mobile.apk** — Android Mobile Browser App (`__TAG__` · `versionCode 550` — Buttery 120Hz Scrolling & Zero-Overlap Edge-to-Edge/IME Polish, Collapsible `34×34px` M3 Butterfly Video FAB, Sleek Android M3 `dejavu Link v2.3` Continuity Hub, 12 HCT Themes & 24 Wallpapers, Brave-Exact Shields `108K+` cached rules + `document_start` scriptlets, V1+V2+V3 permanently signed, Android 8.0+)
          EOF
          sed -i 's/^          //' /tmp/release_notes.md
          sed -i "s/__TAG__/$TAG/g" /tmp/release_notes.md
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            release-files/dejavu-Setup.exe \
            release-files/dejavu.exe \
            release-files/dejavu-mobile.apk \
            --title "dejavu $TAG — Butterfly Video FAB, dejavu Link v2.3 Continuity Hub & 120Hz Android Polish" \
            --notes-file /tmp/release_notes.md
