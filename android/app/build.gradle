plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dathevinci.dejavu'
    compileSdk 35

    defaultConfig {
        applicationId "com.dathevinci.dejavu"
        minSdk 26
        targetSdk 35
        versionCode 540
        versionName "5.4.0"
    }

    signingConfigs {
        release {
            def envPath = System.getenv("DEJAVU_KEYSTORE_PATH")
            def defaultKs = file("../keystore/dejavu-release.jks")
            def ksFile = (envPath != null && !envPath.trim().isEmpty() && file(envPath).exists())
                ? file(envPath)
                : defaultKs
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword System.getenv("DEJAVU_KEYSTORE_PASS") ?: "dejavu2026"
                keyAlias System.getenv("DEJAVU_KEY_ALIAS") ?: "dejavu"
                keyPassword System.getenv("DEJAVU_KEY_PASS") ?: "dejavu2026"
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (signingConfigs.release.storeFile != null && signingConfigs.release.storeFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                throw new GradleException("Persistent release keystore missing! Expected android/keystore/dejavu-release.jks or DEJAVU_KEYSTORE_PATH.")
            }
        }
        debug {
            applicationIdSuffix ""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
